[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outlook-rag"
version = "0.9.0"
description = "Local Outlook semantic and keyword search through MCP and an OpenAI-compatible embedding API"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=1.20,<2", "anyio>=4,<5", "httpx>=0.28,<1", "lancedb>=0.39,<1", "filelock>=3.20,<4", "pywin32>=310; sys_platform == 'win32'", "sudachipy>=0.6,<1", "sudachidict-core"]

[project.scripts]
outlook-rag = "outlook_rag.app:main"

[project.urls]
Repository = "https://github.com/camucamulemon7/outlook-rag"
Issues = "https://github.com/camucamulemon7/outlook-rag/issues"

[project.optional-dependencies]
attachments = [
    "defusedxml>=0.7,<1",
    "psutil>=7,<8",
    "pypdf>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_rag"]

[dependency-groups]
dev = [
    "coverage>=7,<8",
    "mypy>=1.19,<2",
    "pip-audit>=2,<3",
    "psutil>=7,<8",
    "pypdf>=6,<7",
    "ruff>=0.15,<0.16",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["F401", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
